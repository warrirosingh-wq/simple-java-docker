name: first docker image
on:
  push:
   branches: ["main"]
    
jobs:
  deploy:
   runs-on: ubuntu-latest
   steps: 
     - uses: actions/checkout@v4
     - uses: docker/setup-buildx-action@v3
     - uses: docker/build-push-action@v6
       with:
         context: .
         push: false
         tags: my-image:latest
           
  
